<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pulizia e Ordinamento Elenco Nomi</title>
    <!-- Caricamento Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Caricamento Font Inter da Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-50 text-slate-900 font-sans min-h-screen flex flex-col antialiased selection:bg-blue-600 selection:text-white">

    <!-- Intestazione Principale -->
    <header class="bg-white border-b-2 border-slate-200 shadow-sm">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-blue-700 text-white p-2.5 rounded-xl shadow-sm">
                    <!-- Icona SVG elenco ordinato -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 4h13M3 8h9m-9 4h6m4 0l4-4m0 0l4 4m-4-4v12" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-extrabold text-slate-950 tracking-tight">
                        Ordinatore & Filtro Nomi
                    </h1>
                    <p class="text-sm text-slate-600 font-medium">
                        Rimuovi i doppioni, pulisci gli spazi e ordina alfabeticamente
                    </p>
                </div>
            </div>

            <!-- Pulsante rapido per inserire dati di esempio -->
            <div>
                <button id="btnSample" type="button" class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-semibold text-slate-800 bg-slate-100 hover:bg-slate-200 active:bg-slate-300 border-2 border-slate-300 rounded-xl transition-colors focus:outline-none focus:ring-4 focus:ring-blue-500/30">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 text-slate-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" />
                    </svg>
                    Carica esempio
                </button>
            </div>
        </div>
    </header>

    <!-- Contenuto Principale -->
    <main class="flex-grow max-w-6xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8 flex flex-col gap-6">

        <!-- Barra Statistiche e Opzioni -->
        <section aria-label="Opzioni e statistiche" class="bg-white border-2 border-slate-200 rounded-2xl p-4 sm:p-5 shadow-sm flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            
            <!-- Opzione Case-Insensitive -->
            <div class="flex items-start sm:items-center gap-3">
                <input id="chkIgnoreCase" type="checkbox" checked class="mt-1 sm:mt-0 w-5 h-5 text-blue-700 bg-white border-2 border-slate-400 rounded focus:ring-4 focus:ring-blue-500/30 cursor-pointer">
                <label for="chkIgnoreCase" class="text-sm sm:text-base font-semibold text-slate-900 cursor-pointer select-none">
                    Ignora maiuscole/minuscole nei doppioni
                    <span class="block sm:inline text-xs sm:text-sm font-normal text-slate-600 sm:ml-1">(es. "Marco" e "marco" sono considerati uguali)</span>
                </label>
            </div>

            <!-- Contatori Riepilogo -->
            <div class="flex flex-wrap items-center gap-2 sm:gap-3">
                <div class="bg-slate-100 border border-slate-300 px-3.5 py-2 rounded-xl flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-slate-600">Inseriti:</span>
                    <span id="statInputCount" class="text-base font-extrabold text-slate-950">0</span>
                </div>
                <div class="bg-emerald-50 border border-emerald-300 px-3.5 py-2 rounded-xl flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-emerald-800">Unici:</span>
                    <span id="statOutputCount" class="text-base font-extrabold text-emerald-950">0</span>
                </div>
                <div class="bg-amber-50 border border-amber-300 px-3.5 py-2 rounded-xl flex items-center gap-2">
                    <span class="text-xs font-bold uppercase tracking-wider text-amber-800">Rimossi:</span>
                    <span id="statRemovedCount" class="text-base font-extrabold text-amber-950">0</span>
                </div>
            </div>
        </section>

        <!-- Barra Azioni Principali -->
        <section aria-label="Azioni" class="flex flex-col sm:flex-row items-stretch sm:items-center justify-between gap-3">
            <!-- Pulsante Principale -->
            <button id="btnProcess" type="button" class="flex-grow sm:flex-grow-0 inline-flex items-center justify-center gap-2.5 px-6 py-4 text-base sm:text-lg font-bold text-white bg-blue-700 hover:bg-blue-800 active:bg-blue-900 rounded-xl shadow-md hover:shadow-lg transition-all focus:outline-none focus:ring-4 focus:ring-blue-500/40 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z" />
                </svg>
                <span>Elabora / Rimuovi doppioni e ordina</span>
            </button>

            <!-- Azioni Secondarie (Copia e Svuota) -->
            <div class="flex items-center gap-3">
                <button id="btnCopy" type="button" class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-2 px-5 py-3.5 text-sm sm:text-base font-bold text-slate-900 bg-white hover:bg-slate-100 active:bg-slate-200 border-2 border-slate-400 rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-4 focus:ring-blue-500/30 cursor-pointer">
                    <svg id="iconCopy" xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-800" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                    </svg>
                    <span id="textCopy">Copia risultato</span>
                </button>

                <button id="btnClear" type="button" class="flex-1 sm:flex-initial inline-flex items-center justify-center gap-2 px-5 py-3.5 text-sm sm:text-base font-bold text-red-800 bg-red-50 hover:bg-red-100 active:bg-red-200 border-2 border-red-300 rounded-xl shadow-sm transition-colors focus:outline-none focus:ring-4 focus:ring-red-500/30 cursor-pointer">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-red-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                    </svg>
                    <span>Svuota tutto</span>
                </button>
            </div>
        </section>

        <!-- Notifica / Banner Feedback (senza alert) -->
        <div id="feedbackBanner" role="status" aria-live="polite" class="hidden rounded-xl border-2 px-4 py-3 text-sm font-bold flex items-center justify-between transition-all">
            <div class="flex items-center gap-2.5">
                <span id="feedbackIcon"></span>
                <span id="feedbackMessage"></span>
            </div>
            <button id="btnCloseBanner" type="button" aria-label="Chiudi notifica" class="p-1 rounded-lg hover:bg-black/5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Area di Lavoro a Due Colonne (Affiancata su Desktop, Impilata su Mobile) -->
        <section aria-label="Area inserimento e risultato" class="grid grid-cols-1 lg:grid-cols-2 gap-6 flex-grow">
            
            <!-- Colonna 1: Textarea Input -->
            <div class="bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-5 shadow-sm flex flex-col focus-within:border-blue-700 focus-within:ring-4 focus-within:ring-blue-500/15 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <label for="inputNames" class="text-base sm:text-lg font-extrabold text-slate-950 flex items-center gap-2">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-slate-900 text-white text-xs font-bold">1</span>
                        Elenco originale (un nome per riga)
                    </label>
                    <span id="badgeInputLines" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-slate-100 text-slate-800 border border-slate-300">
                        0 righe valide
                    </span>
                </div>
                <textarea 
                    id="inputNames" 
                    rows="12" 
                    placeholder="Incolla o scrivi qui i nomi, uno per riga...&#10;&#10;Esempio:&#10;Luca Bianchi&#10;Anna Verdi&#10;luca bianchi&#10;Marco Rossi"
                    class="w-full flex-grow min-h-[260px] sm:min-h-[340px] p-4 text-base text-slate-950 bg-slate-50 border-2 border-slate-300 rounded-xl focus:bg-white focus:border-blue-700 focus:outline-none resize-y leading-relaxed placeholder:text-slate-400 font-medium"
                ></textarea>
            </div>

            <!-- Colonna 2: Textarea Output -->
            <div class="bg-white border-2 border-slate-300 rounded-2xl p-4 sm:p-5 shadow-sm flex flex-col focus-within:border-emerald-700 focus-within:ring-4 focus-within:ring-emerald-500/15 transition-all">
                <div class="flex items-center justify-between mb-3">
                    <label for="outputNames" class="text-base sm:text-lg font-extrabold text-slate-950 flex items-center gap-2">
                        <span class="inline-flex items-center justify-center w-6 h-6 rounded-full bg-emerald-700 text-white text-xs font-bold">2</span>
                        Elenco pulito e ordinato (A-Z)
                    </label>
                    <span id="badgeOutputLines" class="text-xs font-bold px-2.5 py-1 rounded-lg bg-emerald-50 text-emerald-900 border border-emerald-300">
                        0 risultati
                    </span>
                </div>
                <textarea 
                    id="outputNames" 
                    rows="12" 
                    readonly
                    placeholder="Premi il pulsante 'Elabora / Rimuovi doppioni e ordina' per visualizzare qui l'elenco senza duplicati e in ordine alfabetico."
                    class="w-full flex-grow min-h-[260px] sm:min-h-[340px] p-4 text-base text-slate-950 bg-emerald-50/40 border-2 border-slate-300 rounded-xl focus:bg-white focus:border-emerald-700 focus:outline-none resize-y leading-relaxed placeholder:text-slate-400 font-medium"
                ></textarea>
            </div>

        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 mt-auto">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs sm:text-sm text-slate-600 font-medium">
            Elaborazione locale istantanea nel browser • Ordinamento alfabetico italiano (A-Z)
        </div>
    </footer>

    <!-- Logica Applicativa JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Riferimenti agli elementi del DOM
            const inputNamesEl = document.getElementById('inputNames');
            const outputNamesEl = document.getElementById('outputNames');
            const chkIgnoreCaseEl = document.getElementById('chkIgnoreCase');
            
            const btnProcess = document.getElementById('btnProcess');
            const btnCopy = document.getElementById('btnCopy');
            const btnClear = document.getElementById('btnClear');
            const btnSample = document.getElementById('btnSample');
            
            const statInputCount = document.getElementById('statInputCount');
            const statOutputCount = document.getElementById('statOutputCount');
            const statRemovedCount = document.getElementById('statRemovedCount');
            
            const badgeInputLines = document.getElementById('badgeInputLines');
            const badgeOutputLines = document.getElementById('badgeOutputLines');
            
            const feedbackBanner = document.getElementById('feedbackBanner');
            const feedbackMessage = document.getElementById('feedbackMessage');
            const feedbackIcon = document.getElementById('feedbackIcon');
            const btnCloseBanner = document.getElementById('btnCloseBanner');
            const textCopy = document.getElementById('textCopy');

            let bannerTimeout = null;

            /**
             * Mostra un messaggio di feedback visivo nell'interfaccia (sostituisce alert)
             * @param {string} message - Il testo da mostrare
             * @param {'success'|'warning'|'info'} type - Il tipo di notifica
             */
            function showFeedback(message, type = 'success') {
                if (bannerTimeout) {
                    clearTimeout(bannerTimeout);
                }

                // Reset classi colore
                feedbackBanner.className = 'rounded-xl border-2 px-4 py-3 text-sm font-bold flex items-center justify-between transition-all';

                if (type === 'success') {
                    feedbackBanner.classList.add('bg-emerald-50', 'border-emerald-400', 'text-emerald-950');
                    feedbackIcon.innerHTML = `<svg class="h-5 w-5 text-emerald-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" /></svg>`;
                } else if (type === 'warning') {
                    feedbackBanner.classList.add('bg-amber-50', 'border-amber-400', 'text-amber-950');
                    feedbackIcon.innerHTML = `<svg class="h-5 w-5 text-amber-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>`;
                } else {
                    feedbackBanner.classList.add('bg-blue-50', 'border-blue-400', 'text-blue-950');
                    feedbackIcon.innerHTML = `<svg class="h-5 w-5 text-blue-700" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`;
                }

                feedbackMessage.textContent = message;
                feedbackBanner.classList.remove('hidden');

                bannerTimeout = setTimeout(() => {
                    feedbackBanner.classList.add('hidden');
                }, 4500);
            }

            /**
             * Estrae le righe non vuote e pulite (trim + normalizzazione spazi interni multipli)
             * @param {string} rawText
             * @returns {string[]}
             */
            function extractCleanLines(rawText) {
                if (!rawText) return [];
                return rawText
                    .split(/\r?\n/)
                    .map(line => line.trim().replace(/\s+/g, ' '))
                    .filter(line => line.length > 0);
            }

            /**
             * Aggiorna in tempo reale il conteggio delle righe inserite nell'input
             */
            function updateLiveInputStats() {
                const validLines = extractCleanLines(inputNamesEl.value);
                const count = validLines.length;
                statInputCount.textContent = count;
                badgeInputLines.textContent = `${count} ${count === 1 ? 'riga valida' : 'righe valide'}`;

                // Aggiorna anche il conteggio dei rimossi se c'è già un output
                const currentOutputLines = extractCleanLines(outputNamesEl.value);
                if (currentOutputLines.length > 0 && count >= currentOutputLines.length) {
                    statRemovedCount.textContent = count - currentOutputLines.length;
                } else if (count === 0) {
                    statRemovedCount.textContent = '0';
                }
            }

            /**
             * Elabora l'elenco: rimuove righe vuote, elimina doppioni e ordina alfabeticamente (locale 'it')
             */
            function processNamesList() {
                try {
                    const validLines = extractCleanLines(inputNamesEl.value);

                    if (validLines.length === 0) {
                        outputNamesEl.value = '';
                        statInputCount.textContent = '0';
                        statOutputCount.textContent = '0';
                        statRemovedCount.textContent = '0';
                        badgeOutputLines.textContent = '0 risultati';
                        showFeedback('Inserisci almeno un nome nella casella di sinistra prima di elaborare.', 'warning');
                        inputNamesEl.focus();
                        return;
                    }

                    const ignoreCase = chkIgnoreCaseEl.checked;
                    const seenKeys = new Set();
                    const uniqueNames = [];

                    for (const name of validLines) {
                        const comparisonKey = ignoreCase ? name.toLocaleLowerCase('it') : name;
                        if (!seenKeys.has(comparisonKey)) {
                            seenKeys.add(comparisonKey);
                            uniqueNames.push(name);
                        }
                    }

                    // Ordinamento alfabetico italiano case-insensitive
                    uniqueNames.sort((a, b) => 
                        a.localeCompare(b, 'it', { sensitivity: 'base', numeric: true })
                    );

                    // Popolamento textarea di output
                    outputNamesEl.value = uniqueNames.join('\n');

                    // Aggiornamento statistiche
                    const totalInput = validLines.length;
                    const totalUnique = uniqueNames.length;
                    const totalRemoved = totalInput - totalUnique;

                    statInputCount.textContent = totalInput;
                    statOutputCount.textContent = totalUnique;
                    statRemovedCount.textContent = totalRemoved;

                    badgeInputLines.textContent = `${totalInput} ${totalInput === 1 ? 'riga valida' : 'righe valide'}`;
                    badgeOutputLines.textContent = `${totalUnique} ${totalUnique === 1 ? 'risultato' : 'risultati'}`;

                    // Messaggio di conferma
                    const removedText = totalRemoved === 1 ? '1 doppione rimosso' : `${totalRemoved} doppioni rimossi`;
                    showFeedback(`Elenco elaborato con successo: ${totalUnique} nomi unici ordinati (${removedText}).`, 'success');

                } catch (error) {
                    console.error('Errore durante l\'elaborazione:', error);
                    showFeedback('Si è verificato un errore durante l\'elaborazione dell\'elenco.', 'warning');
                }
            }

            /**
             * Copia il contenuto della textarea di output negli appunti
             */
            function copyResultToClipboard() {
                const textToCopy = outputNamesEl.value;

                if (!textToCopy.trim()) {
                    showFeedback('Non c\'è alcun risultato da copiare. Elabora prima un elenco.', 'warning');
                    return;
                }

                try {
                    outputNamesEl.select();
                    outputNamesEl.setSelectionRange(0, 99999); // Compatibilità dispositivi mobili
                    const successful = document.execCommand('copy');

                    // Deseleziona il testo dopo la copia
                    window.getSelection()?.removeAllRanges();

                    if (successful) {
                        const originalLabel = textCopy.textContent;
                        textCopy.textContent = 'Copiato!';
                        btnCopy.classList.add('bg-emerald-100', 'border-emerald-500', 'text-emerald-950');
                        showFeedback('Elenco copiato negli appunti!', 'success');

                        setTimeout(() => {
                            textCopy.textContent = originalLabel;
                            btnCopy.classList.remove('bg-emerald-100', 'border-emerald-500', 'text-emerald-950');
                        }, 2000);
                    } else {
                        showFeedback('Impossibile copiare automaticamente. Seleziona il testo e copialo manualmente.', 'warning');
                    }
                } catch (err) {
                    console.error('Errore copia appunti:', err);
                    showFeedback('Errore durante la copia negli appunti.', 'warning');
                }
            }

            /**
             * Svuota entrambe le caselle di testo e azzera i contatori
             */
            function clearAllFields() {
                inputNamesEl.value = '';
                outputNamesEl.value = '';
                statInputCount.textContent = '0';
                statOutputCount.textContent = '0';
                statRemovedCount.textContent = '0';
                badgeInputLines.textContent = '0 righe valide';
                badgeOutputLines.textContent = '0 risultati';
                showFeedback('Tutti i campi sono stati svuotati.', 'info');
                inputNamesEl.focus();
            }

            /**
             * Inserisce un elenco di esempio con doppioni, spazi e maiuscole miste
             */
            function loadSampleData() {
                const sample = [
                    "Giulia Conti",
                    "  Marco Rossi  ",
                    "Alessandro Moretti",
                    "giulia conti",
                    "Elena Ferrari",
                    "",
                    "Luca Bianchi",
                    "MARCO ROSSI",
                    "Chiara Esposito",
                    "Andrea Romano",
                    "   ",
                    "Elena Ferrari",
                    "Davide Colombo",
                    "Sofia Ricci"
                ].join('\n');

                inputNamesEl.value = sample;
                outputNamesEl.value = '';
                statOutputCount.textContent = '0';
                statRemovedCount.textContent = '0';
                badgeOutputLines.textContent = '0 risultati';
                updateLiveInputStats();
                showFeedback('Elenco di esempio caricato! Premi "Elabora / Rimuovi doppioni e ordina".', 'info');
            }

            // Event Listeners
            inputNamesEl.addEventListener('input', updateLiveInputStats);
            btnProcess.addEventListener('click', processNamesList);
            btnCopy.addEventListener('click', copyResultToClipboard);
            btnClear.addEventListener('click', clearAllFields);
            btnSample.addEventListener('click', loadSampleData);
            btnCloseBanner.addEventListener('click', () => feedbackBanner.classList.add('hidden'));

            // Rielabora automaticamente se cambia l'opzione case-insensitive e c'è già un output
            chkIgnoreCaseEl.addEventListener('change', () => {
                if (outputNamesEl.value.trim().length > 0) {
                    processNamesList();
                }
            });
        });
    </script>
</body>
</html>
